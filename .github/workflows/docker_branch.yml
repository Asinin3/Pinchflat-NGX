name: Build Branch Image

# Fork-only: builds any branch to its own image tags so test builds of
# different branches don't overwrite each other's `dev` tag. Run it from the
# default branch and name the branch to build.

on:
  workflow_dispatch:
    inputs:
      branch:
        type: string
        description: 'Branch to build'
        required: true
      platforms:
        type: choice
        description: 'Build platforms'
        required: true
        default: 'linux/amd64'
        options:
          - 'linux/amd64'
          - 'linux/amd64,linux/arm64'

# Builds of the same branch write the same tags, so serialize them per branch.
concurrency:
  group: docker-branch-images-${{ inputs.branch }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  resolve:
    name: Resolve branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}

      - name: Resolve commit and tag
        id: resolve
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          # "feat/Some_Thing" -> "branch-feat-some_thing", within Docker's 128-character tag limit
          # once the commit and -postgres suffixes are added.
          slug=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^[.-]+//; s/[.-]+$//' | cut -c1-70)
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=branch-${slug}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.database }}, ${{ matrix.platform }})
    needs: resolve
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
        platform: ${{ fromJSON(inputs.platforms == 'linux/amd64,linux/arm64' && '["linux/amd64","linux/arm64"]' || '["linux/amd64"]') }}
    steps:
      - name: Prepare image name
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=${REGISTRY}/${owner}/pinchflat-ngx" >> "$GITHUB_ENV"
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - name: Checkout resolved commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./docker/selfhosted.Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            DATABASE_ADAPTER=${{ matrix.database }}
            YT_DLP_CACHE_BUST=${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.database }}-${{ env.PLATFORM_PAIR }}
            BUILD_TRACK=dev
            BUILD_SHA=${{ needs.resolve.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.resolve.outputs.sha }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ matrix.database }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=build-${{ matrix.database }}-${{ env.PLATFORM_PAIR }},mode=max
          sbom: true
          provenance: true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: branch-digests-${{ matrix.database }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish (${{ matrix.database }})
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        database: [sqlite, postgres]
    steps:
      - name: Prepare image tags
        env:
          SUFFIX: ${{ matrix.database == 'postgres' && '-postgres' || '' }}
          BRANCH_TAG: ${{ needs.resolve.outputs.tag }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          {
            echo "IMAGE_NAME=${REGISTRY}/${owner}/pinchflat-ngx"
            echo "MOVING_TAG=${BRANCH_TAG}${SUFFIX}"
            echo "COMMIT_TAG=${BRANCH_TAG}-${SHA:0:12}${SUFFIX}"
          } >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: branch-digests-${{ matrix.database }}-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish branch tags
        working-directory: /tmp/digests
        env:
          BRANCH: ${{ inputs.branch }}
          SHA: ${{ needs.resolve.outputs.sha }}
          PLATFORMS: ${{ inputs.platforms }}
          DATABASE: ${{ matrix.database }}
        run: |
          sources=()
          for digest in *; do sources+=("${IMAGE_NAME}@sha256:${digest}"); done
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${MOVING_TAG}" \
            --tag "${IMAGE_NAME}:${COMMIT_TAG}" \
            "${sources[@]}"
          docker buildx imagetools inspect "${IMAGE_NAME}:${COMMIT_TAG}"
          {
            echo "### Branch image (${DATABASE})"
            echo "- Branch: \`${BRANCH}\`"
            echo "- Commit: ${SHA}"
            echo "- Platforms: ${PLATFORMS}"
            echo "- Moving tag: \`${IMAGE_NAME}:${MOVING_TAG}\`"
            echo "- Commit tag: \`${IMAGE_NAME}:${COMMIT_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
